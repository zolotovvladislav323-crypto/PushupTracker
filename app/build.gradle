plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourapp.pushup'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourapp.pushup"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Оставляем JDK, чтобы ему не пришлось качать его через npx
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # Создаем манифест, если нет
      - name: Create Web App Manifest
        run: |
          if [ ! -f "manifest.json" ]; then
            echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json
          fi

      # ФИНАЛЬНОЕ ИСПРАВЛЕНИЕ: 
      # 1. DEBIAN_FRONTEND=noninteractive отключает все интерактивные вопросы
      # 2. Флаг --yes гарантирует согласие
      # 3. Весь шаг объединен в одну строку
      - name: Initialize and Build (Полностью автономно)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          npx @bubblewrap/cli init --manifest manifest.json --yes
          npx @bubblewrap/cli build --yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

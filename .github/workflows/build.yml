name: Build APK (Ultimate Working Version)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем Android SDK и инструменты сборки (это делает Gradle счастливым)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # САМОЕ ВАЖНОЕ: Скачиваем шаблон PWABuilder архивом и собираем нативно
      - name: Download and Build
        run: |
          wget https://github.com/pwa-builder/pwa-android-wrapper/archive/refs/heads/main.zip
          unzip main.zip
          mv pwa-android-wrapper-main pwa-android-wrapper
          
          cp manifest.json pwa-android-wrapper/app/src/main/assets/manifest.json
          
          cd pwa-android-wrapper
          chmod +x gradlew
          ./gradlew build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: pwa-android-wrapper/app/build/outputs/apk/debug/app-debug.apk

name: Build APK (Прямая сборка Gradle)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install expect
        run: sudo apt-get install -y --no-install-recommends expect

      # Инициализация (Создаём структуру папок Android, отвечая "n" на все вопросы)
      - name: Initialize Bubblewrap
        run: |
          expect <<EOF
          spawn npx @bubblewrap/cli init --manifest manifest.json
          expect "Do you want Bubblewrap to install the JDK" { send "n\r" }
          expect "Do you want Bubblewrap to install the Android SDK" { send "n\r" }
          expect "Do you agree to the Android SDK terms" { send "y\r" }
          expect eof
          EOF

      # СБОРКА APK (Здесь мы обходим проклятый bubblewrap build и используем нативный Gradle)
      - name: Build Native APK via Gradle
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug

      # Находим APK и выводим его в корень
      - name: Find and rename APK
        run: |
          APK_FILE=$(find app/build/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ Не найден APK! Вывод структуры папок для отладки:"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "✅ APK найден по пути: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

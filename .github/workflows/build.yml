name: Build APK (Ultimate Final)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Для надежности ставим Android SDK, чтобы заглушить второй вопрос
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # САМОЕ ГЛАВНОЕ ИЗМЕНЕНИЕ:
      # Отправляем строго 2 ответа "Y" (первый для JDK, второй для Android SDK).
      # В логах появится всего 2 строчки "y", а не 80 тысяч!
      - name: Initialize Bubblewrap
        run: (echo "y"; echo "y") | npx @bubblewrap/cli init --manifest manifest.json

      # Запускаем сборку. Если и тут вылезет вопрос, флаг --yes решит его без диалога.
      - name: Build APK
        run: npx @bubblewrap/cli build --yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

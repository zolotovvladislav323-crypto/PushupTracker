name: Build APK (Последнее решение)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # Устанавливаем PWABuilder
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      # ПРОСТО И БЕЗ ВОПРОСОВ: Утилита сама соберёт APK
      - name: Build APK
        run: npx @pwabuilder/cli package manifest.json android

      # Ищем APK в папке dist (обычно pwabuilder складывает туда)
      - name: Find and rename APK
        run: |
          APK_FILE=$(find dist -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK не найден в папке dist! Ищем по всему проекту..."
            APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          fi
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK всё равно не найден. Вывод структуры папок:"
            ls -la
            exit 1
          fi
          
          echo "✅ APK найден по пути: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

name: Build APK (Прямая сборка Gradle)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install expect
        run: sudo apt-get install -y --no-install-recommends expect

      # Инициализация
      - name: Initialize Bubblewrap
        run: |
          expect <<EOF
          spawn npx @bubblewrap/cli init --manifest manifest.json
          expect "Do you want Bubblewrap to install the JDK" { send "n\r" }
          expect "Do you want Bubblewrap to install the Android SDK" { send "n\r" }
          expect "Do you agree to the Android SDK terms" { send "y\r" }
          expect eof
          EOF

      # ГЛАВНОЕ ИСПРАВЛЕНИЕ: Запускаем сборку прямо из корня
      - name: Build APK via Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Копируем файл (он лежит по строго определённому пути)
      - name: Rename APK
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ./app-release.apk
            echo "✅ APK успешно скопирован!"
          else
            echo "❌ APK не найден по пути app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      # Загружаем файл
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

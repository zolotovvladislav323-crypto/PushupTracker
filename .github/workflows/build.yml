name: Build APK (Абсолютная победа)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Манифест с безопасной встроенной иконкой (никаких внешних URL-адресов)
      - name: Create Web App Manifest
        run: |
          cat > manifest.json <<EOF
          {
            "name": "My App",
            "short_name": "App",
            "start_url": "https://www.google.com",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#000000",
            "icons": [{
              "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23333'/%3E%3Ctext x='50%25' y='50%25' font-size='100' text-anchor='middle' dy='.3em' fill='white'%3EApp%3C/text%3E%3C/svg%3E",
              "sizes": "512x512",
              "type": "image/svg+xml"
            }]
          }
          EOF

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install expect
        run: sudo apt-get install -y --no-install-recommends expect

      # КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: Не отправляем пути. Отвечаем строго на 3 вопроса.
      - name: Generate TWA Project
        run: |
          expect <<EOF
          spawn npx @bubblewrap/cli generate --manifest manifest.json --output android
          expect "Do you want Bubblewrap to install the JDK" { send "n\r" }
          expect "Do you want Bubblewrap to install the Android SDK" { send "n\r" }
          expect "Do you agree to the Android SDK terms" { send "y\r" }
          expect eof
          EOF

      # Чистая сборка через Gradle в папке android
      - name: Build APK using Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      # Точный путь к APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/debug/app-debug.apk

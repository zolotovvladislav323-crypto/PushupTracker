name: Build APK (Абсолютно чистая сборка)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # САМОЕ ВАЖНОЕ ИЗМЕНЕНИЕ: 
      # Передаём пути к JDK и SDK прямо в аргументы. Вопросы отменяются!
      - name: Initialize Bubblewrap (No Interactive)
        run: bubblewrap init --manifest manifest.json --jdk-path "$JAVA_HOME" --android-sdk-path "$ANDROID_HOME"

      # ОТКАЗЫВАЕМСЯ ОТ BUBBLEWRAP BUILD. 
      # Собираем APK через нативный Gradle.
      - name: Build APK using Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      # Находим APK в точной папке
      - name: Find and rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK не найден! Проверяем папку app/build/outputs/apk:"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "✅ APK найден по пути: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk

      # Загружаем результат
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

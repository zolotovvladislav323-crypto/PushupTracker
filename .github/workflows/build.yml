name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Web App Manifest
        run: |
          if [ ! -f "manifest.json" ]; then
            echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json
          fi

      # КЛЮЧЕВОЕ ИЗМЕНЕНИЕ: Переходим в папку ДО того, как запускается Bubblewrap
      # Если он видит, что мы уже внутри проекта, он не задает вопросов
      - name: Prepare TWA project manually
        run: |
          mkdir -p twa-manifest
          cd twa-manifest
          npx @bubblewrap/cli generate --manifest ../manifest.json
          npx @bubblewrap/cli validate

      - name: Build APK
        working-directory: ./twa-manifest
        run: npx @bubblewrap/cli build --yes

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-manifest/app-release.apk

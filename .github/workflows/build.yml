name: Build Android APK (PWABuilder)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Обязательно ставим JDK, чтобы pwabuilder нашел его
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Создаем манифест (если его нет)
      - name: Create Web App Manifest
        run: |
          if [ ! -f "manifest.json" ]; then
            echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json
          fi

      # 2. Устанавливаем альтернативу Bubblewrap, которая работает без падений
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      # 3. Собираем APK. 
      # Ключевое отличие: pwabuilder НЕ ЗАДАЕТ вопросы, он просто работает.
      - name: Build APK
        run: |
          npx @pwabuilder/cli package --platform android --manifest manifest.json --output ./dist

      # 4. Ищем файл и загружаем его
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/*.apk

name: Build APK (Идеальное решение)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # БОЛЬШЕ НИКАКОГО EXPECT. Мы отправляем ответы по очереди с паузами в 2 секунды.
      - name: Initialize Bubblewrap
        run: |
          ( echo "n"; sleep 2; echo "$JAVA_HOME"; sleep 2; echo "n"; sleep 2; echo "$ANDROID_HOME"; sleep 2; echo "y" ) | npx @bubblewrap/cli init --manifest manifest.json

      # Абсолютно та же логика для сборки
      - name: Build APK
        run: |
          ( echo "n"; sleep 2; echo "$JAVA_HOME"; sleep 2; echo "n"; sleep 2; echo "$ANDROID_HOME"; sleep 2; echo "y" ) | npx @bubblewrap/cli build

      # Находим APK в любой папке
      - name: Find and rename APK
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK не найден! Вывод папок:"
            ls -la
            exit 1
          fi
          echo "✅ APK найден по пути: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

name: Build Android APK (Final)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Создаем манифест
      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # 2. Устанавливаем Bubblewrap
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 3. СБОРКА. Используем команду yes, которая принудительно отправляет "Y" на все вопросы.
      # Команда yes | ... работает лучше, чем echo или флаги, если программа тупит.
      - name: Build APK (Forced Auto-Answer)
        run: |
          yes | npx @bubblewrap/cli init --manifest manifest.json
          npx @bubblewrap/cli build

      # 4. Загружаем результат
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

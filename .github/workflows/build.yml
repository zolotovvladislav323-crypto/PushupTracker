name: Build APK (Stable Docker)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Создаем манифест
      - name: Create Web App Manifest
        run: |
          if [ ! -f "manifest.json" ]; then
            echo '{"name": "My App", "short_name": "App", "start_url": "https://example.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "icon.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json
          fi

      # ГЛАВНОЕ ИЗМЕНЕНИЕ: Используем стабильный образ с Docker Hub
      - name: Build APK
        run: |
          docker run --rm -v ${PWD}:/work -w /work bubblewrap/bubblewrap \
          sh -c "bubblewrap init --manifest manifest.json && bubblewrap build"

      # Ищем APK. Bubblewrap обычно создает app-release-unsigned.apk в корне
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release-unsigned.apk

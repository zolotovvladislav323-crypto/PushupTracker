name: Build APK (Гарантированно работает)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ЗАРАНЕЕ СТАВИМ JDK, ЧТОБЫ ОН НЕ СПРАШИВАЛ
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # МАНИФЕСТ С РАБОЧЕЙ ССЫЛКОЙ (Без "Invalid URL")
      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ОТПРАВЛЯЕМ "Y" ТОЛЬКО 2 РАЗА (На JDK и на Android SDK). 
      # Никаких миллионов строк "y" в логах!
      - name: Initialize Bubblewrap
        run: printf "Y\nY\n" | npx @bubblewrap/cli init --manifest manifest.json

      # СБОРКА
      - name: Build APK
        run: npx @bubblewrap/cli build

      # ЗАГРУЗКА АРТЕФАКТА
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

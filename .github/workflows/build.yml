name: Build APK (No Bubblewrap CLI)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (твой проект)
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Создаём рабочий манифест
      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # Скачиваем готовый Android шаблон (не через wget, а через git clone, это 100% не даст 404)
      - name: Download Android Wrapper
        run: git clone --depth 1 https://github.com/pwa-builder/pwa-android-wrapper.git

      # Копируем манифест в проект и запускаем нативную сборку Андроид
      - name: Build APK via Gradle
        run: |
          cp manifest.json pwa-android-wrapper/app/src/main/assets/manifest.json
          cd pwa-android-wrapper
          chmod +x gradlew
          ./gradlew build

      # Загружаем результат
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: pwa-android-wrapper/app/build/outputs/apk/debug/app-debug.apk

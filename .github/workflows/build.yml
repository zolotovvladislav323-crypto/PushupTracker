name: Build APK (Финальная победа)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Безопасный манифест с встроенной SVG-иконкой
      - name: Create Web App Manifest
        run: |
          cat > manifest.json <<EOF
          {
            "name": "My App",
            "short_name": "App",
            "start_url": "https://www.google.com",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#000000",
            "icons": [{
              "src": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23333'/%3E%3Ctext x='50%25' y='50%25' font-size='100' text-anchor='middle' dy='.3em' fill='white'%3EApp%3C/text%3E%3C/svg%3E",
              "sizes": "512x512",
              "type": "image/svg+xml"
            }]
          }
          EOF

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install expect
        run: sudo apt-get install -y --no-install-recommends expect

      # ГЛАВНОЕ ИСПРАВЛЕНИЕ: Используем init (а не generate) и убираем exp_continue, чтобы не было зацикливания.
      - name: Initialize TWA Project
        run: |
          expect <<EOF
          spawn npx @bubblewrap/cli init --manifest manifest.json
          expect "Do you want Bubblewrap to install the JDK" { send "n\r" }
          expect "Path to your existing JDK" { send "$::env(JAVA_HOME)\r" }
          expect "Do you want Bubblewrap to install the Android SDK" { send "n\r" }
          expect "Path to your existing Android SDK" { send "$::env(ANDROID_HOME)\r" }
          expect "Do you agree to the Android SDK terms" { send "y\r" }
          expect eof
          EOF

      # ВАЖНО: Так как init создает проект в корне, мы убираем переход cd android.
      - name: Build APK using Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      # Исправляем путь к APK (теперь он в корневой папке app)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/debug/app-debug.apk

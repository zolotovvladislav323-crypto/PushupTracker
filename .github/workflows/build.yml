name: Build APK (Абсолютный финал)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ВАЖНОЕ ИСПРАВЛЕНИЕ: Устанавливаем expect до того, как его использовать!
      - name: Install expect
        run: sudo apt-get install -y --no-install-recommends expect

      # ИНИЦИАЛИЗАЦИЯ (exp_continue решит проблему повторяющихся вопросов)
      - name: Initialize Bubblewrap
        run: |
          expect -c '
          set timeout 30
          spawn bubblewrap init --manifest manifest.json
          expect {
              "Do you want Bubblewrap to install the JDK" { send "n\r"; exp_continue }
              "Path to your existing JDK" { send "'"$JAVA_HOME"'\r"; exp_continue }
              "Do you want Bubblewrap to install the Android SDK" { send "n\r"; exp_continue }
              "Path to your existing Android SDK" { send "'"$ANDROID_HOME"'\r"; exp_continue }
              "Do you agree to the Android SDK terms" { send "y\r"; exp_continue }
              eof
          }
          '

      # СБОРКА: Используем нативный Gradle (он не задаёт вопросов)
      - name: Build APK using Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      # Поиск APK в любой папке
      - name: Find and rename APK
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ APK не найден! Проверяем папку app/build/outputs/apk/debug/:"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "✅ APK найден по пути: $APK_FILE"
          cp "$APK_FILE" ./app-release.apk

      # ЗАГРУЗКА
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./app-release.apk

name: Build APK (Идеальный финальный вариант)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Устанавливаем JDK, чтобы Bubblewrap не задавал вопрос про него
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ: Устанавливаем Android SDK!
      # Теперь Bubblewrap не будет задавать второй вопрос
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Создаем манифест с реально существующими ссылками
      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ТЕПЕРЬ ТУТ НЕТ НИКАКИХ echo ИЛИ printf.
      # Он не задаст вопросы, так как SDK и JDK уже есть, и пойдет дальше.
      - name: Initialize Bubblewrap
        run: npx @bubblewrap/cli init --manifest manifest.json

      # Запускаем сборку
      - name: Build APK
        run: npx @bubblewrap/cli build

      # Загружаем результат
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk

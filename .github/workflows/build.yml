name: Build APK (Гарантированная сборка без Bubblewrap)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository (твой проект)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # САМОЕ ВАЖНОЕ: Скачиваем обёртку через официальный экшн (не git clone)
      # Это 100% исключает ошибки 404 и отказ в доступе.
      - name: Checkout PWABuilder Wrapper
        uses: actions/checkout@v4
        with:
          repository: 'PWABuilder/pwa-android-wrapper'
          path: 'android-wrapper'

      # Копируем манифест в проект
      - name: Prepare Wrapper
        run: cp manifest.json android-wrapper/app/src/main/assets/manifest.json

      # Собираем нативный APK
      - name: Build APK using Gradle
        run: |
          cd android-wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      # Загружаем артефакт
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk

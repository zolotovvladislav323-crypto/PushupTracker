name: Build APK (Гарантированная сборка)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Обязательно ставим JDK и SDK перед сборкой
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Создаем манифест
      - name: Create Web App Manifest
        run: |
          echo '{"name": "My App", "short_name": "App", "start_url": "https://www.google.com", "display": "standalone", "background_color": "#ffffff", "theme_color": "#000000", "icons": [{"src": "https://www.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png", "sizes": "512x512", "type": "image/png"}]}' > manifest.json

      # КЛЮЧЕВОЕ: Клонируем обёртку через токен (этот метод работал на скриншоте 60!)
      - name: Download Android Wrapper
        run: git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/pwa-builder/pwa-android-wrapper.git android-wrapper

      # КОМПИЛЯЦИЯ: Копируем манифест и запускаем Gradle из корня
      - name: Build APK using Gradle
        run: |
          cp manifest.json android-wrapper/app/src/main/assets/manifest.json
          cd android-wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      # ЗАГРУЗКА: Точный путь к готовому APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
